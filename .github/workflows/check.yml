name: make check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run make check in every chapter
        run: |
          for d in ch*/; do
            echo "::group::$d"
            make -C "$d" check
            echo "::endgroup::"
          done
